id = "sessionizer"
name = "Sessionizer"
description = "tmux-sessionizer for herdr: fzf over open workspaces and zoxide directories, create-or-focus with template tabs"
version = "0.4.0"
min_herdr_version = "0.7.0"
platforms = ["macos", "linux"]

# Keybinding target: [[keys.command]] type = "plugin_action", command = "sessionizer.pick"
[[actions]]
id = "pick"
title = "Open workspace picker"
command = ["bash", "bin/open-picker"]

[[panes]]
id = "picker"
title = "Sessionizer"
placement = "overlay"
command = ["bash", "bin/sessionizer"]

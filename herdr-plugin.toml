id = "sessionizer"
name = "Sessionizer"
description = "tmux-sessionizer for herdr: fzf over open workspaces and project directories, create-or-focus with template tabs"
version = "0.5.0"
min_herdr_version = "0.7.0"
platforms = ["macos", "linux"]

# Keybinding targets: [[keys.command]] type = "plugin_action",
# command = "sessionizer.pick" or "sessionizer.agents"
[[actions]]
id = "pick"
title = "Open workspace picker"
command = ["bash", "bin/open-picker"]

[[actions]]
id = "agents"
title = "Open agent view"
command = ["bash", "bin/open-picker", "--agents"]

[[panes]]
id = "picker"
title = "Sessionizer"
placement = "overlay"
command = ["bash", "bin/sessionizer"]
